<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C788" />
      <stop offset="45%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9E7833" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B3A" />
      <stop offset="100%" stop-color="#1C3D52" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#142B3A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Crown + Architecture Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Architectural Plinth / Foundation -->
    <rect x="10" y="58" width="52" height="4" rx="2" fill="url(#goldGrad)" />
    <rect x="16" y="52" width="40" height="3" rx="1.5" fill="#142B3A" />
    
    <!-- Architectural Pillars -->
    <path d="M 22 52 L 22 36 M 36 52 L 36 32 M 50 52 L 50 36" stroke="#142B3A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Royal Crown Geometry -->
    <path d="M 14 36 L 20 20 L 36 30 L 52 20 L 58 36 Z" fill="url(#goldGrad)" />
    
    <!-- Central Crown Peak & Jewels -->
    <circle cx="20" cy="18" r="2.5" fill="#142B3A" />
    <circle cx="36" cy="12" r="3.5" fill="url(#goldGrad)" />
    <circle cx="52" cy="18" r="2.5" fill="#142B3A" />
    <polygon points="36,15 39,23 36,26 33,23" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Subtle Roof Gable Line -->
    <path d="M 12 37 L 36 18 L 60 37" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <!-- "ROYAL PROPERTY" -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', 'Inter', 'Cinzel', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="3.5" fill="#142B3A">ROYAL</text>
  <text x="216" y="44" font-family="'Plus Jakarta Sans', 'Inter', 'Cinzel', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="3.5" fill="url(#goldGrad)">PROPERTY</text>

  <!-- Tagline / Descriptor -->
  <text x="84" y="65" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.8" fill="#667085">YOUR DREAM HOME AWAITS</text>
  
  <!-- Subtle divider dot & Location -->
  <circle cx="270" cy="62" r="1.5" fill="#C6A15B" />
  <text x="278" y="65" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.5" fill="#C6A15B">BAREILLY</text>
</svg>
